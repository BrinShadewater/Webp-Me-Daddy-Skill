name: CI

# SKILL.md asks for the test suite after meaningful script changes. Now it runs on
# every one, whether anyone remembered or not.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Test suite
        run: python scripts/test_prepare_image.py
      - name: CLI answers --help
        run: python scripts/webp_me_daddy.py --help > /dev/null
