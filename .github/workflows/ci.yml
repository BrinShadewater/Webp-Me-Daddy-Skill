name: CI

# SKILL.md asks for the test suite after meaningful script changes. Now it runs on
# every one, whether anyone remembered or not.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The `animate` command shells out to the companion tool, and one test exercises
      # it. The resolver looks for a sibling checkout or TRANSPARENT_GIF_LOOP_DIR; a CI
      # workspace has neither, which is how the first run of this workflow failed.
      - name: Checkout companion transparent-gif-loop
        uses: actions/checkout@v4
        with:
          repository: BrinShadewater/Transparent-Gif-Loop-Skill
          path: companion/transparent-gif-loop
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Test suite
        env:
          TRANSPARENT_GIF_LOOP_DIR: ${{ github.workspace }}/companion/transparent-gif-loop
        run: python scripts/test_prepare_image.py
      - name: CLI answers --help
        run: python scripts/webp_me_daddy.py --help > /dev/null
